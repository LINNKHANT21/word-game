<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Word Guess Game</title>

<style>
:root {
  --bg: #121213;
  --text: white;
  --tile: #121213;
  --border: #3a3a3c;
}

.light {
  --bg: #f5f5f5;
  --text: #111;
  --tile: white;
  --border: #ccc;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
  background: var(--bg);
  color: var(--text);
}

h1 {
  margin: 10px;
}

#controls {
  margin: 10px;
}

select, button {
  padding: 8px;
  margin: 5px;
  font-size: 16px;
  cursor: pointer;
}

#grid {
  display: grid;
  gap: 6px;
  justify-content: center;
  margin: 20px auto;
}

.tile {
  width: 50px;
  height: 50px;
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  text-transform: uppercase;
  background: var(--tile);
  transition: transform 0.4s;
}

.tile.flip {
  transform: rotateX(90deg);
}

.green { background: #6aaa64; color: white; }
.yellow { background: #c9b458; color: white; }
.red { background: #3a3a3c; color: white; }

#keyboard {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 520px;
  margin: auto;
}

.key {
  padding: 10px;
  margin: 4px;
  background: #818384;
  border-radius: 6px;
  cursor: pointer;
  user-select: none;
}

.key.green { background: #6aaa64; }
.key.yellow { background: #c9b458; }
.key.red { background: #3a3a3c; }

@media (max-width: 600px) {
  .tile {
    width: 42px;
    height: 42px;
    font-size: 18px;
  }
}
</style>
</head>

<body>

<h1>Word Guess Game</h1>

<div id="controls">
  <select id="length">
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5" selected>5</option>
    <option value="6">6</option>
    <option value="7">7</option>
    <option value="8">8</option>
  </select>

  <button onclick="startGame()">New Game</button>
  <button onclick="toggleTheme()">🌗 Toggle Theme</button>
</div>

<div id="grid"></div>
<div id="keyboard"></div>

<script>
// Large word bank (sample expanded)
const WORDS = [
"at","be","do","go","it","me","no","up",
"cat","dog","sun","sky","pen","hat","map",
"tree","book","fish","milk","ring","fire",
"apple","grape","chair","table","plant","stone",
"planet","school","banana","orange","window","flower",
"battery","country","picture","library","machine",
"elephant","computer","building","language","internet"
];

let word = "";
let currentRow = 0;
let currentCol = 0;
let guesses = [];
let wordLength = 5;
const maxAttempts = 6;

// Filter words by length
function getWordList(len) {
  return WORDS.filter(w => w.length === len);
}

// Better randomness
function getRandomWord(len) {
  const list = getWordList(len);
  if (list.length === 0) {
    return "a".repeat(len); // fallback
  }
  return list[Math.floor(Math.random() * list.length)];
}

function startGame() {
  wordLength = parseInt(document.getElementById("length").value);
  word = getRandomWord(wordLength);
  console.log("Word:", word);

  currentRow = 0;
  currentCol = 0;
  guesses = Array.from({ length: maxAttempts }, () => Array(wordLength).fill(""));

  createGrid();
  createKeyboard();
}

function createGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  grid.style.gridTemplateColumns = `repeat(${wordLength}, 1fr)`;

  for (let r = 0; r < maxAttempts; r++) {
    for (let c = 0; c < wordLength; c++) {
      let tile = document.createElement("div");
      tile.className = "tile";
      tile.id = `tile-${r}-${c}`;
      grid.appendChild(tile);
    }
  }
}

function createKeyboard() {
  const keyboard = document.getElementById("keyboard");
  keyboard.innerHTML = "";

  const keys = "QWERTYUIOPASDFGHJKLZXCVBNM";

  keys.split("").forEach(letter => {
    let key = document.createElement("div");
    key.textContent = letter;
    key.className = "key";
    key.onclick = () => handleKey(letter);
    keyboard.appendChild(key);
  });

  addSpecialKey("ENTER", submitGuess);
  addSpecialKey("⌫", deleteLetter);
}

function addSpecialKey(label, func) {
  let key = document.createElement("div");
  key.textContent = label;
  key.className = "key";
  key.onclick = func;
  document.getElementById("keyboard").appendChild(key);
}

function handleKey(letter) {
  if (currentCol < wordLength) {
    guesses[currentRow][currentCol] = letter;
    document.getElementById(`tile-${currentRow}-${currentCol}`).textContent = letter;
    currentCol++;
  }
}

function deleteLetter() {
  if (currentCol > 0) {
    currentCol--;
    guesses[currentRow][currentCol] = "";
    document.getElementById(`tile-${currentRow}-${currentCol}`).textContent = "";
  }
}

function submitGuess() {
  if (currentCol < wordLength) return;

  let guess = guesses[currentRow].join("").toLowerCase();
  let target = word.split("");
  let result = Array(wordLength).fill("red");

  // Greens
  for (let i = 0; i < wordLength; i++) {
    if (guess[i] === target[i]) {
      result[i] = "green";
      target[i] = null;
    }
  }

  // Yellows
  for (let i = 0; i < wordLength; i++) {
    if (result[i] !== "green" && target.includes(guess[i])) {
      result[i] = "yellow";
      target[target.indexOf(guess[i])] = null;
    }
  }

  // Apply colors + animation
  for (let i = 0; i < wordLength; i++) {
    let tile = document.getElementById(`tile-${currentRow}-${i}`);
    setTimeout(() => {
      tile.classList.add("flip");
      setTimeout(() => {
        tile.classList.add(result[i]);
        updateKeyColor(guess[i], result[i]);
      }, 150);
    }, i * 150);
  }

  if (guess === word) {
    setTimeout(() => alert("🎉 You Win!"), 800);
    return;
  }

  currentRow++;
  currentCol = 0;

  if (currentRow === maxAttempts) {
    setTimeout(() => alert("💀 Game Over! Word: " + word), 800);
  }
}

function updateKeyColor(letter, color) {
  document.querySelectorAll(".key").forEach(key => {
    if (key.textContent === letter.toUpperCase()) {
      key.classList.remove("red","yellow","green");
      key.classList.add(color);
    }
  });
}

// Theme toggle
function toggleTheme() {
  document.body.classList.toggle("light");
}

startGame();
</script>

</body>
</html>
